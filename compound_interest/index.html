<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compound Interest Calculator</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="calculator">

        <h1>Compound Interest Calculator</h1>
        <label for="p">Principle</label>
        <input id="p" type="number"><br>

        <label for="r">Annual Interest Rate</label>
        <input id="r" type="number"><br>

        <label for="n">Compounded</label>
        <select id="n">
            <option value=1>Annually</option>
            <option value="2">Semiannually</option>
            <option value="3">Quarterly</option>
            <option value="12">Monthly</option>
        </select> <br>

        <label for="t">Total Time</label>
        <select id="t">
            <option value="1">1 year</option>
            <option value="1">2 year</option>
            <option value="1">3 year</option>
            <option value="1">4 year</option>
            <option value="1">5 year</option>
            <option value="1">6 year</option>
            <option value="1">7 year</option>
            <option value="1">8 year</option>
            <option value="1">9 year</option>

        </select>

        <button id="calculateBtn">Calculate</button>
        <h1 id="result"></h1>

    </div>


    <script src="app.js"></script>


    


    
</body>
</html>
