<body>
    <form>
        <h1>Temperature Conversion</h1>
        <input type="number" id="temp" placeholder="Enter your temperature here">
        <div class = "input">
        <input id="celcius" name="mode" type="radio">
        <label for="celcius">Ceisius -> Fahrenheit</label>
        </div>
        <div class = "input">
        <input id="fahrenheit" name="mode" type="radio">

        </div>

        <button type="button" id="submitBtn" onclick="convert()">Submit</button><br>
        <span id ="result"></span>        
    </form>
